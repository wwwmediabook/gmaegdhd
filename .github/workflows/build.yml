name: Build Android APK
# Phone-friendly: upload the project .zip to the repo root (do NOT extract). This workflow unzips it,
# installs Godot 4.3 + Android SDK, builds a debug APK and publishes it under "Releases".
# If it fails, the real reason is shown in the red "Annotations" box on the run's Summary page.
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 1) Find project (unzip if needed)
        shell: bash
        run: |
          trap 'echo "::error::Step 1 (find/unzip project) failed near line $LINENO"' ERR
          set -e
          ls -la
          if [ -f project.godot ]; then
            P=.
          else
            Z=$(ls -1 ./*.zip 2>/dev/null | sort | tail -n 1 || true)
            if [ -z "$Z" ]; then
              echo "::notice::No project.godot and no .zip in the repo root yet. Upload the project .zip, then it will build."
              echo "SKIP=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Using zip: $Z"
            mkdir -p _unzipped
            unzip -o -q "$Z" -d _unzipped
            F=$(find _unzipped -name project.godot -not -path '*/.godot/*' | head -n 1)
            if [ -z "$F" ]; then echo "::error::project.godot not found inside $Z"; exit 1; fi
            P=$(dirname "$F")
          fi
          echo "Project dir: $P"
          echo "PROJECT_DIR=$(cd "$P" && pwd)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        if: env.SKIP != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        if: env.SKIP != 'true'
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: 2) Install Godot 4.3 + export templates + editor settings
        if: env.SKIP != 'true'
        shell: bash
        run: |
          trap 'echo "::error::Step 2 (install Godot/Android setup) failed near line $LINENO"' ERR
          set -e
          cd "$RUNNER_TEMP"
          B=https://github.com/godotengine/godot/releases/download/4.3-stable
          wget -q "$B/Godot_v4.3-stable_linux.x86_64.zip"
          wget -q "$B/Godot_v4.3-stable_export_templates.tpz"
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable" "$HOME/.config/godot"
          unzip -q Godot_v4.3-stable_export_templates.tpz -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          godot --version
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"; ls "$SDK" "$SDK/cmdline-tools" "$SDK/build-tools" || true
          if [ ! -e "$SDK/cmdline-tools/latest" ]; then
            D=$(ls -d "$SDK"/cmdline-tools/*/ | head -n 1); ln -s "$D" "$SDK/cmdline-tools/latest"
          fi
          JH="$JAVA_HOME"; echo "JAVA_HOME=$JH"
          rm -f "$HOME/debug.keystore"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JH"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOT

      - name: 3) Import assets
        if: env.SKIP != 'true'
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          godot --headless --import > "$GITHUB_WORKSPACE/import.log" 2>&1 || true
          tail -n 25 "$GITHUB_WORKSPACE/import.log"
          grep -iE "parse error|script error" "$GITHUB_WORKSPACE/import.log" | head -n 5 | while read -r l; do echo "::warning::${l:0:300}"; done || true

      - name: 4) Export APK
        if: env.SKIP != 'true'
        shell: bash
        run: |
          OUT="$GITHUB_WORKSPACE/build/dinajpur-jhenaidah.apk"
          mkdir -p "$GITHUB_WORKSPACE/build"
          cd "$PROJECT_DIR"
          godot --headless --verbose --export-debug "Android" "$OUT" > "$GITHUB_WORKSPACE/export.log" 2>&1 || true
          tail -n 60 "$GITHUB_WORKSPACE/export.log"
          if [ ! -f "$OUT" ]; then
            grep -iE "error|failed|invalid|not found|missing|cannot" "$GITHUB_WORKSPACE/export.log" | head -n 8 | while read -r l; do echo "::error::${l:0:300}"; done || true
            echo "::error::APK was not created - see the lines above"
            exit 1
          fi
          ls -la "$GITHUB_WORKSPACE/build"

      - uses: actions/upload-artifact@v4
        if: always() && env.SKIP != 'true'
        with:
          name: build-logs
          path: |
            import.log
            export.log
          if-no-files-found: ignore

      - name: 5) Publish APK to Releases
        if: env.SKIP != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: build/dinajpur-jhenaidah.apk
